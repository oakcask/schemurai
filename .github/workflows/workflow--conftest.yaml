name: workflow / conftest

on:
  pull_request:
    paths:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - conftest/conventional-commits/*.rego
      - conftest/workflow/*.rego

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: openpolicyagent/conftest:v0.71.0@sha256:3ec6dad358db08acecda56b7a3184037cd810394a65046fafa4f33c7750141b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Conventional Commits policy regressions
        run: conftest verify -p conftest/conventional-commits
      - name: Verify workflow policy regressions
        run: conftest verify -p conftest/workflow
      - run: conftest test -o github -p conftest/workflow .github/workflows
