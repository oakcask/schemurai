name: test / evaluator backends

on:
  push:
    branches: [main]
    paths: &backend_paths
      - .github/workflows/test--evaluator-backends.yaml
      - .gitmodules
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - schemurai.gemspec
      - lib/**/*
      - oracle/**/*
      - test/evaluator_backend_test.rb
  pull_request:
    paths: *backend_paths

permissions:
  contents: read

env:
  BUNDLE_ONLY: default lint test

jobs:
  vm-differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby-version: ["3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: vm-${{ matrix.os }}-${{ matrix.ruby-version }}-${{ hashFiles('Gemfile.lock') }}
      - name: Compare VM evaluator with the Ruby oracle
        run: bundle exec rspec -Ilib test/evaluator_backend_test.rb
        env:
          SCHEMURAI_DIFFERENTIAL_BACKEND: vm
