name: test / package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--package.yaml
      - .ruby-version
      - schemurai.gemspec
      - lib/**/*
      - ext/**/*
      - sig/**/*
      - README.md
      - test/package_smoke_test.rb
      - script/install-without-cargo
  pull_request:
    paths:
      - .github/workflows/test--package.yaml
      - .ruby-version
      - schemurai.gemspec
      - lib/**/*
      - ext/**/*
      - sig/**/*
      - README.md
      - test/package_smoke_test.rb
      - script/install-without-cargo

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
      - name: Build gem
        run: gem build schemurai.gemspec --output schemurai.gem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: schemurai-package
          path: schemurai.gem
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        ruby-version:
          - "4.0.0"
          - "4.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: test/package_smoke_test.rb
          sparse-checkout-cone-mode: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: schemurai-package
      - name: Install gem
        run: gem install --local schemurai.gem --no-document
      - name: Run package smoke test
        run: ruby test/package_smoke_test.rb

  without-cargo:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        ruby-version: ["4.0.0", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            test/package_smoke_test.rb
            script/install-without-cargo
          sparse-checkout-cone-mode: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: schemurai-package
      - name: Install gem without cargo on PATH
        run: ruby script/install-without-cargo schemurai.gem
      - name: Check Ruby and VM without the native extension
        run: ruby test/package_smoke_test.rb
        env:
          SCHEMURAI_EXPECT_NO_NATIVE: "1"
