name: lint / rbs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rbs.yaml
      - Gemfile
      - Gemfile.lock
      - script/format-rbs
      - sig/**/*
  pull_request:
    paths:
      - .github/workflows/lint--rbs.yaml
      - Gemfile
      - Gemfile.lock
      - script/format-rbs
      - sig/**/*

permissions:
  contents: read

env:
  BUNDLE_ONLY: type_check

jobs:
  rbs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Validate RBS signatures
        run: bundle exec rbs -I sig validate
      - name: Check RBS formatting
        run: bundle exec ruby script/format-rbs --check
