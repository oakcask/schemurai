name: test / rspec

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--rspec.yaml
      - .gitmodules
      - Gemfile.lock
      - lib/**/*
      - oracle/**/*
      - script/oracle-*
      - spec/**/*
  pull_request:
    paths:
      - .github/workflows/test--rspec.yaml
      - .gitmodules
      - Gemfile.lock
      - lib/**/*
      - oracle/**/*
      - script/oracle-*
      - spec/**/*

permissions:
  contents: read

env:
  BUNDLE_ONLY: default test
  SCHEMURAI_BACKEND: ruby
  SCHEMURAI_NATIVE_LOADING: prohibited

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Run Ruby tests
        run: bundle exec rspec
      - name: Verify oracle case catalog
        run: ruby script/oracle-cases --summary
