name: workflow / oracle counts tests

on:
  pull_request:
    paths:
      - .github/workflows/workflow--oracle-counts-tests.yaml
      - .github/workflows/workflow--oracle-counts.yaml
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - schemurai.gemspec
      - oracle/lib/case_catalog.rb
      - script/oracle-cases
      - workflow-script/oracle-counts/**

permissions:
  contents: read

env:
  BUNDLE_ONLY: default test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Test official suite count updates
        run: bundle exec rspec workflow-script/oracle-counts/update_spec.rb --order random
