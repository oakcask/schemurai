name: benchmark / native backends

on:
  push:
    branches: [main]
    paths: &benchmark_paths
      - .github/workflows/benchmark--native-backends.yaml
      - .gitmodules
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - rust-toolchain.toml
      - schemurai.gemspec
      - benchmark/native.rb
      - script/native-benchmark-summary
      - spec/native_benchmark_summary_spec.rb
      - lib/**/*
      - ext/**/*
  pull_request:
    paths: *benchmark_paths
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ONLY: default

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build native backend
        working-directory: ext/schemurai_native
        run: |
          ruby extconf.rb
          make
      - name: Compare VM and native with YJIT
        run: bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
        env:
          BENCHMARK_JSON: native-benchmark.json
      - name: Publish benchmark summary
        if: always()
        run: ruby script/native-benchmark-summary native-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-benchmark-${{ matrix.os }}
          path: native-benchmark.json
          if-no-files-found: ignore
