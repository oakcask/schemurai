name: benchmark / native backends

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  BUNDLE_ONLY: default

jobs:
  compare:
    if: github.event.label.name == 'workflow:enable-benchmark'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build native backend
        working-directory: ext/schemurai_native
        run: |
          ruby extconf.rb
          make
      - name: Compare VM and native with YJIT
        run: bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
        env:
          BENCHMARK_JSON: native-benchmark.json
      - name: Publish benchmark summary
        if: always()
        run: ruby script/native-benchmark-summary native-benchmark.json
      - name: Check out comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-base
      - name: Build comparison baseline
        working-directory: .benchmark-base/ext/schemurai_native
        run: |
          ruby extconf.rb
          make
      - name: Compare pattern kernels on the same runner
        run: |
          cp benchmark/native.rb .benchmark-base/benchmark/native.rb
          BENCHMARK_JSON=pattern-base-1.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
          BENCHMARK_JSON=pattern-head-1.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=pattern-head-2.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=pattern-base-2.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
        env:
          BENCHMARK_GROUP: pattern
          BENCHMARK_ITERATIONS: "15"
          BENCHMARK_BATCH: "25"
      - name: Publish same-runner comparison
        run: ruby script/native-benchmark-comparison pattern
      - name: Compare integer kernels on the same runner
        run: |
          BENCHMARK_JSON=integer-base-1.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
          BENCHMARK_JSON=integer-head-1.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=integer-head-2.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=integer-base-2.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
        env:
          BENCHMARK_WORKLOAD: integer array
          BENCHMARK_ITERATIONS: "31"
          BENCHMARK_BATCH: "1000"
      - name: Publish integer comparison
        run: ruby script/native-benchmark-comparison integer
      - name: Compare content kernels on the same runner
        run: |
          BENCHMARK_JSON=content-base-1.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
          BENCHMARK_JSON=content-head-1.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=content-head-2.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=content-base-2.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
        env:
          BENCHMARK_GROUP: content
          BENCHMARK_WIDTH: "100"
          BENCHMARK_ITERATIONS: "15"
          BENCHMARK_BATCH: "25"
      - name: Publish content comparison
        run: ruby script/native-benchmark-comparison content
      - name: Compare format kernels on the same runner
        run: |
          BENCHMARK_JSON=format-base-1.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
          BENCHMARK_JSON=format-head-1.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=format-head-2.json bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
          BENCHMARK_JSON=format-base-2.json bundle exec ruby --yjit -I.benchmark-base/ext/schemurai_native .benchmark-base/benchmark/native.rb
        env:
          BENCHMARK_GROUP: format
          BENCHMARK_ITERATIONS: "15"
          BENCHMARK_BATCH: "25"
      - name: Publish format comparison
        run: ruby script/native-benchmark-comparison format
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-benchmark-${{ matrix.os }}
          path: |
            native-benchmark.json
            format-*.json
            pattern-*.json
            integer-*.json
            content-*.json
          if-no-files-found: ignore
