name: benchmark / native backends

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  BUNDLE_ONLY: default

jobs:
  compare:
    if: github.event.label.name == 'workflow:enable-benchmark'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build native backend
        working-directory: ext/schemurai_native
        run: |
          ruby extconf.rb
          make
      - name: Compare VM and native with YJIT
        run: bundle exec ruby --yjit -Iext/schemurai_native benchmark/native.rb
        env:
          BENCHMARK_JSON: native-benchmark.json
      - name: Publish benchmark summary
        if: always()
        run: ruby script/native-benchmark-summary native-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-benchmark-${{ matrix.os }}
          path: native-benchmark.json
          if-no-files-found: ignore
