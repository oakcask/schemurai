name: release / lockfile

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'oakcask-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--main')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: gh-token-gen
        uses: oakcask/gh-token-gen@4bd7b29d36a07b1de07b49c9fdbfe16c03d00bc2 # v5.1.0
        with:
          app-id: ${{ secrets.TOKEN_GEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_GEN_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.gh-token-gen.outputs.token }}
          submodules: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      # release-please does not update the Bundler 4 CHECKSUMS entry for the
      # gem being released. Regenerate it whenever the release PR is updated.
      - run: bundle lock
      - uses: int128/update-generated-files-action@03f443b7de5481c9a896b1b9e7a14f64612cb541 # v2.111.0
        with:
          commit-message: "chore: regenerate lockfile"
          token: ${{ steps.gh-token-gen.outputs.token }}
