name: release / lockfile

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'oakcask-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--main')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: gh-token-gen
        uses: oakcask/gh-token-gen@4bd7b29d36a07b1de07b49c9fdbfe16c03d00bc2 # v5.1.0
        with:
          app-id: ${{ secrets.TOKEN_GEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_GEN_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.gh-token-gen.outputs.token }}
          submodules: true
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      # release-please does not update the Bundler 4 CHECKSUMS entry for the
      # gem being released. Regenerate it whenever the release PR is updated.
      - run: bundle lock
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Sync native crate version with the gem
        run: |
          ruby -Ilib -rschemurai/version <<'RUBY'
          path = "ext/schemurai_native/Cargo.toml"
          manifest = File.read(path)
          manifest.sub!(/^(\[package\]\nname = "schemurai-native"\n)version = "[^"]+"$/) do
            "#{$1}version = #{Schemurai::VERSION.dump}"
          end || abort("schemurai-native package version not found")
          File.write(path, manifest)
          RUBY
          cargo update --manifest-path ext/schemurai_native/Cargo.toml --workspace
      - uses: int128/update-generated-files-action@1486b210d2f982ac40d27ef55660863b006722b0 # v2.115.0
        with:
          commit-message: "chore: sync release versions and lockfiles"
          token: ${{ steps.gh-token-gen.outputs.token }}
