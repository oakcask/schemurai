name: benchmark / pull request

on:
  pull_request:
    paths:
      - .github/workflows/benchmark--pull-request.yaml
      - .gitmodules
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - schemurai.gemspec
      - benchmark/**/*
      - lib/**/*
      - references/JSON-Schema-Test-Suite
      - script/benchmark-compare
      - spec/schemurai_benchmark/comparison_spec.rb

permissions:
  contents: read

env:
  BUNDLE_ONLY: default benchmark
  BENCHMARK_TIME: "5"
  BENCHMARK_WARMUP: "2"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          fetch-depth: 2
          submodules: true
      - name: Create base worktree
        run: git worktree add --detach refs/base HEAD^1
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
          cache-version: benchmark-${{ hashFiles('Gemfile.lock') }}
      - name: Compare base and merge benchmarks
        run: bundle exec ruby script/benchmark-compare
        env:
          BASELINE_LIB: refs/base/lib
          BASELINE_LABEL: base (${{ github.event.pull_request.base.sha }})
          CANDIDATE_LABEL: refs/pull/${{ github.event.number }}/merge (${{ github.sha }})
