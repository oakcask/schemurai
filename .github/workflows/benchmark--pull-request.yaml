name: benchmark / pull request

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  BUNDLE_ONLY: default benchmark
  BENCHMARK_TIME: "5"
  BENCHMARK_WARMUP: "2"

jobs:
  compare:
    if: github.event.label.name == 'workflow:enable-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          fetch-depth: 2
          submodules: true
      - name: Create base worktree
        run: git worktree add --detach refs/base HEAD^1
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          bundler-cache: true
          cache-version: benchmark-${{ hashFiles('Gemfile.lock') }}
      - name: Compare base and merge benchmarks
        run: bundle exec ruby script/benchmark-compare
        env:
          BASELINE_LIB: refs/base/lib
          BASELINE_LABEL: base (${{ github.event.pull_request.base.sha }})
          CANDIDATE_LABEL: refs/pull/${{ github.event.number }}/merge (${{ github.sha }})
