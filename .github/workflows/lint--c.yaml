name: lint / c

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--c.yaml
      - .clang-format
      - .clang-tidy
      - Rakefile
      - ext/**/*.c
      - ext/**/*.h
  pull_request:
    paths:
      - .github/workflows/lint--c.yaml
      - .clang-format
      - .clang-tidy
      - Rakefile
      - ext/**/*.c
      - ext/**/*.h

permissions:
  contents: read

env:
  BUNDLE_ONLY: default

jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Update package index
        run: sudo apt-get update
      - name: Install LLVM 18 tools
        run: sudo apt-get install --no-install-recommends clang-format-18 clang-tidy-18
      - name: Check C formatting
        run: bundle exec rake c:format:check
      - name: Lint C sources
        run: bundle exec rake c:lint
