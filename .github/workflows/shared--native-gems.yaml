name: shared / native gems

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]
        libc: [gnu, musl]
        cpu: [x86_64, aarch64]
        include:
          - os: ubuntu-24.04
            cpu: x86_64
          - os: ubuntu-24.04-arm
            cpu: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Compile Linux extension
        env:
          RUBY_IMAGE: ruby:${{ matrix.ruby }}-${{ matrix.libc == 'musl' && 'alpine3.23' || 'bookworm' }}
          LIBC: ${{ matrix.libc }}
        run: docker run --rm --volume "$PWD:$PWD" --workdir "$PWD" "$RUBY_IMAGE" sh script/build-native-linux "$LIBC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-extension-${{ matrix.cpu }}-linux-${{ matrix.libc }}-${{ matrix.ruby }}
          path: native/
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]
        os: [macos-15-intel, macos-15]
        include:
          - os: macos-15-intel
            platform: x86_64-darwin
          - os: macos-15
            platform: arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compile macOS extension
        run: ruby script/build-native-extension native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-extension-${{ matrix.platform }}-${{ matrix.ruby }}
          path: native/
          if-no-files-found: error

  package:
    needs: [build-linux, build-macos]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      - name: Collect all Ruby ABIs for this platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-extension-${{ matrix.platform }}-*
          path: native
          merge-multiple: true
      - name: Build native gem
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ruby script/build-native-gem "$PLATFORM" native pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          compression-level: 0
          if-no-files-found: error

  test-linux:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0.0", "4.0"]
        libc: [gnu, musl]
        cpu: [x86_64, aarch64]
        include:
          - cpu: x86_64
            os: ubuntu-24.04
          - cpu: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gem-${{ matrix.cpu }}-linux-${{ matrix.libc }}
          path: pkg
      - name: Install and test without build tools
        env:
          RUBY_IMAGE: ruby:${{ matrix.ruby }}-${{ matrix.libc == 'musl' && 'alpine3.23' || 'slim-bookworm' }}
          SCHEMURAI_NATIVE_PLATFORM: ${{ matrix.cpu }}-linux-${{ matrix.libc }}
        run: >-
          docker run --rm --volume "$PWD:$PWD" --workdir "$PWD"
          --env SCHEMURAI_NATIVE_PLATFORM "$RUBY_IMAGE"
          sh -c 'ruby script/test-native-gem pkg/*.gem'

  test-macos:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0.0", "4.0"]
        os: [macos-15-intel, macos-15]
        include:
          - os: macos-15-intel
            platform: x86_64-darwin
          - os: macos-15
            platform: arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gem-${{ matrix.platform }}
          path: pkg
      - name: Install and test without build tools
        env:
          SCHEMURAI_NATIVE_PLATFORM: ${{ matrix.platform }}
        run: ruby script/test-native-gem pkg/*.gem
