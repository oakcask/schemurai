name: lint / rdoc

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rdoc.yaml
      - Gemfile.lock
      - Rakefile
      - lib/**/*
      - README.md
  pull_request:
    paths:
      - .github/workflows/lint--rdoc.yaml
      - Gemfile.lock
      - Rakefile
      - lib/**/*
      - README.md

permissions:
  contents: read

env:
  BUNDLE_ONLY: documentation

jobs:
  rdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Generate API documentation
        run: bundle exec rake rdoc
