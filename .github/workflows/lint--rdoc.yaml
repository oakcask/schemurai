name: lint / rdoc

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rdoc.yaml
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - schemurai.gemspec
      - Rakefile
      - lib/**/*
      - README.md
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/lint--rdoc.yaml
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - schemurai.gemspec
      - Rakefile
      - lib/**/*
      - README.md
      - LICENSE

permissions:
  contents: read

env:
  BUNDLE_ONLY: documentation

jobs:
  rdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Generate API documentation
        run: bundle exec rake rdoc
