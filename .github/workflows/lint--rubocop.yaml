name: lint / rubocop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - schemurai.gemspec
      - script/benchmark-compare
      - script/fetch-real-world-schemas
      - script/format-rbs
      - script/oracle-*
      - script/real-world-fuzz
      - "**/*.rb"
  pull_request:
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - schemurai.gemspec
      - script/benchmark-compare
      - script/fetch-real-world-schemas
      - script/format-rbs
      - script/oracle-*
      - script/real-world-fuzz
      - "**/*.rb"

permissions:
  contents: read

env:
  BUNDLE_ONLY: lint

jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # FIXME: no need to checkout references/**
          submodules: true
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Run Ruby tests
        run: bundle exec rubocop
