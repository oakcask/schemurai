name: lint / rubocop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - Gemfile.lock
      - "**/*.rb"
  pull_request:
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - Gemfile.lock
      - "**/*.rb"

permissions:
  contents: read

env:
  BUNDLE_ONLY: lint

jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # FIXME: no need to checkout references/**
          submodules: true
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Run Ruby tests
        run: bundle exec rubocop
