name: shared / conventional commits

on:
  workflow_call:
    inputs:
      payload:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: openpolicyagent/conftest:v0.69.0@sha256:a38ba21668929a00dce2fe6ee43d1312228340bce5fd243f47dd0ce90516e558
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Write Conventional Commits input
        shell: sh
        env:
          CONVENTIONAL_COMMITS_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -eu
          printf '%s\n' "${CONVENTIONAL_COMMITS_PAYLOAD}" > conventional-commits.json
      - name: Validate Conventional Commits syntax
        run: conftest test -o github -p conftest/conventional-commits conventional-commits.json
