[package]
name = "schemurai-native"
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
base64-simd = "0.8.0"
base64-turbo = "0.5.0"
memchr = "2.8.3"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
ryu = "1.0.23"

[lib]
crate-type = ["staticlib"]

[profile.release]
lto = true
codegen-units = 1
